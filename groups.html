<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Groups - SmartClass Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .groups-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .group-card {
            background: #1E293B;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #334155;
        }
        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #334155;
        }
        .group-number {
            font-size: 18px;
            font-weight: 700;
            color: #60A5FA;
        }
        .group-avg {
            background: #0F172A;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
        }
        .group-leader {
            background: #2563EB20;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .group-leader i {
            color: #F59E0B;
        }
        .members-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .member-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #334155;
            font-size: 14px;
        }
        .member-name {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .member-score {
            font-weight: 600;
        }
        .score-high { color: #10B981; }
        .score-low { color: #EF4444; }
        .score-med { color: #F59E0B; }
        .group-config {
            background: #1E293B;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .config-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .config-group {
            flex: 1;
        }
        .config-group label {
            display: block;
            margin-bottom: 8px;
            color: #9CA3AF;
            font-size: 14px;
        }
        .config-group input, .config-group select {
            width: 100%;
            padding: 10px;
            background: #0F172A;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
        }
        .strategy-buttons {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        .strategy-btn {
            flex: 1;
            padding: 10px;
            background: #0F172A;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #9CA3AF;
            cursor: pointer;
        }
        .strategy-btn.active {
            background: #2563EB;
            border-color: #2563EB;
            color: white;
        }
    </style>
</head>
<body>

<div class="app-container">
    <aside class="sidebar" id="sidebar">[... same sidebar as classes.html ...]</aside>

    <main class="main-content">
        <header class="top-header">[... same header ...]</header>

        <div class="section">
            <div class="section-header">
                <h2>Smart Groups</h2>
                <button class="btn-secondary" id="refreshGroupsBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
            </div>

            <!-- Class Selector -->
            <div class="class-selector" id="classSelector" style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px;"></div>

            <!-- Group Configuration -->
            <div id="groupConfig" style="display: none;">
                <div class="group-config">
                    <h3 style="margin-bottom: 16px;">Group Configuration</h3>
                    <div class="config-row">
                        <div class="config-group">
                            <label>Number of Groups</label>
                            <input type="number" id="numGroups" min="2" max="10" value="6">
                        </div>
                        <div class="config-group">
                            <label>Students per group</label>
                            <input type="text" id="studentsPerGroup" readonly disabled>
                        </div>
                        <div class="config-group">
                            <button class="btn-primary" id="generateGroupsBtn" style="width: 100%;">🎲 Generate Groups</button>
                        </div>
                    </div>
                    <div class="strategy-buttons">
                        <button class="strategy-btn" data-strategy="balanced">⚖️ Balanced by Performance</button>
                        <button class="strategy-btn" data-strategy="random">🎲 Random Grouping</button>
                        <button class="strategy-btn" data-strategy="same">🏆 Best Together</button>
                    </div>
                </div>
            </div>

            <!-- Groups Display -->
            <div id="groupsContainer" class="groups-container"></div>
        </div>
    </main>
</div>

<script src="js/app.js"></script>
<script>
    let currentClassId = null;
    let currentStrategy = 'balanced';
    let currentStudents = [];

    document.addEventListener('DOMContentLoaded', () => {
        loadClasses();
        setupEventListeners();
    });

    function setupEventListeners() {
        document.getElementById('generateGroupsBtn')?.addEventListener('click', generateGroups);
        document.getElementById('refreshGroupsBtn')?.addEventListener('click', () => generateGroups());
        
        document.querySelectorAll('.strategy-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.strategy-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentStrategy = btn.dataset.strategy;
            });
        });
        
        document.getElementById('numGroups')?.addEventListener('input', updateStudentsPerGroup);
    }

    async function loadClasses() {
        const token = localStorage.getItem('teacherToken');
        try {
            const response = await fetch('/api/classes', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();
            if (data.success) {
                displayClassSelector(data.data);
            }
        } catch (error) {
            console.error('Error loading classes:', error);
        }
    }

    function displayClassSelector(classes) {
        const container = document.getElementById('classSelector');
        container.innerHTML = classes.map(cls => `
            <button class="class-card" data-class-id="${cls.class_id}" style="background: #1E293B; border: 1px solid #334155; border-radius: 12px; padding: 12px 20px; cursor: pointer;">
                ${cls.name} <small style="color: #9CA3AF;">(${cls.student_count || 0} students)</small>
            </button>
        `).join('');
        
        document.querySelectorAll('.class-card').forEach(btn => {
            btn.addEventListener('click', () => selectClass(btn.dataset.classId));
        });
    }

    async function selectClass(classId) {
        currentClassId = classId;
        document.getElementById('groupConfig').style.display = 'block';
        
        await loadStudents(classId);
        updateStudentsPerGroup();
    }

    async function loadStudents(classId) {
        const token = localStorage.getItem('teacherToken');
        try {
            const response = await fetch(`/api/classes/${classId}/students`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();
            if (data.success) {
                currentStudents = data.data;
            }
        } catch (error) {
            console.error('Error loading students:', error);
        }
    }

    function updateStudentsPerGroup() {
        const numGroups = parseInt(document.getElementById('numGroups').value) || 6;
        const studentsPerGroup = Math.ceil(currentStudents.length / numGroups);
        document.getElementById('studentsPerGroup').value = studentsPerGroup;
    }

    async function generateGroups() {
        const numGroups = parseInt(document.getElementById('numGroups').value);
        
        const token = localStorage.getItem('teacherToken');
        try {
            const response = await fetch('/api/groups/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({
                    class_id: currentClassId,
                    num_groups: numGroups,
                    strategy: currentStrategy
                })
            });
            const data = await response.json();
            if (data.success) {
                displayGroups(data.data);
            }
        } catch (error) {
            console.error('Error generating groups:', error);
        }
    }

    function displayGroups(groups) {
        const container = document.getElementById('groupsContainer');
        container.innerHTML = groups.map(group => `
            <div class="group-card">
                <div class="group-header">
                    <span class="group-number"><i class="fas fa-users"></i> GROUP ${group.group_number}</span>
                    <span class="group-avg">Avg: ${group.average}%</span>
                </div>
                <div class="group-leader">
                    <i class="fas fa-crown"></i> Captain: ${group.leader || 'Not assigned'}
                </div>
                <div class="members-list">
                    ${group.members.map(member => `
                        <div class="member-item">
                            <div class="member-name">
                                <i class="fas fa-user-graduate"></i>
                                <span>${member.name}</span>
                            </div>
                            <div class="member-score ${getScoreClass(member.average)}">${member.average || 0}%</div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `).join('');
    }

    function getScoreClass(score) {
        if (score >= 80) return 'score-high';
        if (score >= 50) return 'score-med';
        return 'score-low';
    }
</script>
</body>
</html>
