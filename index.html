<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SmartClass Analytics - Teacher Portal</title>
    <link rel="icon" type="image/png" href="assets/icons/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            animation: float 20s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-100vh) translateX(100px); opacity: 0; }
        }

        /* Login Container */
        .login-container {
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 48px 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(59, 130, 246, 0.3);
            animation: slideUp 0.6s ease-out;
            z-index: 10;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #60A5FA, #A78BFA);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo p {
            color: #9CA3AF;
            font-size: 14px;
            margin-top: 8px;
        }

        .tabs {
            display: flex;
            gap: 16px;
            margin-bottom: 32px;
            border-bottom: 1px solid #374151;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            color: #9CA3AF;
            font-weight: 500;
            transition: all 0.3s;
            position: relative;
        }

        .tab.active {
            color: #60A5FA;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: #60A5FA;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #D1D5DB;
            font-size: 14px;
            font-weight: 500;
        }

        .input-group {
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #6B7280;
            font-size: 18px;
        }

        input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: #1E293B;
            border: 1px solid #374151;
            border-radius: 12px;
            color: #FFFFFF;
            font-size: 16px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #60A5FA;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
        }

        input::placeholder {
            color: #6B7280;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563EB, #1D4ED8);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #EF4444;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
            color: #EF4444;
            font-size: 14px;
            text-align: center;
        }

        .footer {
            text-align: center;
            margin-top: 32px;
            color: #6B7280;
            font-size: 12px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="login-container">
    <div class="logo">
        <h1>🎓 SMARTCLASS ANALYTICS</h1>
        <p>Teacher's Ultimate Companion</p>
    </div>

    <div class="tabs">
        <div class="tab active" data-tab="login">LOGIN</div>
        <div class="tab" data-tab="signup">SIGN UP</div>
    </div>

    <!-- Login Form -->
    <form id="loginForm" method="post" action="/api/login">
        <div id="loginError" class="error-message hidden"></div>
        
        <div class="form-group">
            <label>Email Address</label>
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" name="email" placeholder="teacher@school.rw" required>
            </div>
        </div>

        <div class="form-group">
            <label>Password</label>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn">
            <i class="fas fa-arrow-right-to-bracket"></i> LOGIN
        </button>
    </form>

    <!-- Signup Form -->
    <form id="signupForm" method="post" action="/api/signup" class="hidden">
        <div id="signupError" class="error-message hidden"></div>

        <div class="form-group">
            <label>Full Name</label>
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" name="fullname" placeholder="Mr. Jean UWIMANA" required>
            </div>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" name="email" placeholder="teacher@school.rw" required>
            </div>
        </div>

        <div class="form-group">
            <label>School Name</label>
            <div class="input-group">
                <i class="fas fa-school"></i>
                <input type="text" name="school" placeholder="G.S. Saint Andre" required>
            </div>
        </div>

        <div class="form-group">
            <label>Subject Taught</label>
            <div class="input-group">
                <i class="fas fa-flask"></i>
                <input type="text" name="subject" placeholder="Physics" required>
            </div>
        </div>

        <div class="form-group">
            <label>Password</label>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" name="confirm_password" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn">
            <i class="fas fa-user-plus"></i> CREATE ACCOUNT
        </button>
    </form>

    <div class="footer">
        <p>© 2026 SmartClass Analytics | Secure Teacher Portal</p>
        <p style="margin-top: 8px;">Works offline • Syncs when online</p>
    </div>
</div>

<script>
    // Generate floating particles
    function createParticles() {
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 50; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            const size = Math.random() * 8 + 2;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 20 + 's';
            particle.style.animationDuration = Math.random() * 15 + 10 + 's';
            particlesContainer.appendChild(particle);
        }
    }
    createParticles();

    // Tab switching
    const tabs = document.querySelectorAll('.tab');
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');

    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            
            if (tab.dataset.tab === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
            }
        });
    });

    // Form submissions
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = loginForm.querySelector('input[name="email"]').value;
        const password = loginForm.querySelector('input[name="password"]').value;
        
        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await response.json();
            
            if (data.success) {
                localStorage.setItem('teacherToken', data.token);
                localStorage.setItem('teacherName', data.name);
                window.location.href = '/dashboard.html';
            } else {
                const errorDiv = document.getElementById('loginError');
                errorDiv.textContent = data.message || 'Invalid credentials';
                errorDiv.classList.remove('hidden');
                setTimeout(() => errorDiv.classList.add('hidden'), 3000);
            }
        } catch (error) {
            console.error('Login error:', error);
        }
    });

    signupForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = signupForm.querySelector('input[name="password"]').value;
        const confirmPassword = signupForm.querySelector('input[name="confirm_password"]').value;
        
        if (password !== confirmPassword) {
            const errorDiv = document.getElementById('signupError');
            errorDiv.textContent = 'Passwords do not match';
            errorDiv.classList.remove('hidden');
            setTimeout(() => errorDiv.classList.add('hidden'), 3000);
            return;
        }
        
        const formData = {
            fullname: signupForm.querySelector('input[name="fullname"]').value,
            email: signupForm.querySelector('input[name="email"]').value,
            school: signupForm.querySelector('input[name="school"]').value,
            subject: signupForm.querySelector('input[name="subject"]').value,
            password: password
        };
        
        try {
            const response = await fetch('/api/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });
            const data = await response.json();
            
            if (data.success) {
                alert('Account created successfully! Please login.');
                document.querySelector('.tab[data-tab="login"]').click();
            } else {
                const errorDiv = document.getElementById('signupError');
                errorDiv.textContent = data.message || 'Signup failed';
                errorDiv.classList.remove('hidden');
                setTimeout(() => errorDiv.classList.add('hidden'), 3000);
            }
        } catch (error) {
            console.error('Signup error:', error);
        }
    });
</script>

</body>
</html>
