<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartClass Analytics - Teacher Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 48px 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo h1 { font-size: 28px; font-weight: 700; background: linear-gradient(135deg, #60A5FA, #A78BFA); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .logo p { color: #9CA3AF; font-size: 14px; margin-top: 8px; }
        .tabs { display: flex; gap: 16px; margin-bottom: 32px; border-bottom: 1px solid #374151; }
        .tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; color: #9CA3AF; font-weight: 500; transition: all 0.3s; position: relative; }
        .tab.active { color: #60A5FA; }
        .tab.active::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; background: #60A5FA; }
        .form-group { margin-bottom: 24px; }
        label { display: block; margin-bottom: 8px; color: #D1D5DB; font-size: 14px; font-weight: 500; }
        .input-group { position: relative; }
        .input-group i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #6B7280; font-size: 18px; }
        input { width: 100%; padding: 14px 16px 14px 48px; background: #1E293B; border: 1px solid #374151; border-radius: 12px; color: #FFFFFF; font-size: 16px; }
        input:focus { outline: none; border-color: #60A5FA; box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2); }
        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #2563EB, #1D4ED8); border: none; border-radius: 12px; color: white; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4); }
        .error-message { background: rgba(239, 68, 68, 0.1); border: 1px solid #EF4444; border-radius: 12px; padding: 12px; margin-bottom: 20px; color: #EF4444; font-size: 14px; text-align: center; }
        .success-message { background: rgba(16, 185, 129, 0.1); border: 1px solid #10B981; border-radius: 12px; padding: 12px; margin-bottom: 20px; color: #10B981; font-size: 14px; text-align: center; }
        .hidden { display: none; }
        .footer { text-align: center; margin-top: 32px; color: #6B7280; font-size: 12px; }
    </style>
</head>
<body>

<div class="login-container">
    <div class="logo">
        <h1>🎓 SMARTCLASS ANALYTICS</h1>
        <p>Teacher's Ultimate Companion</p>
    </div>

    <div class="tabs">
        <div class="tab active" data-tab="login">LOGIN</div>
        <div class="tab" data-tab="signup">SIGN UP</div>
    </div>

    <!-- Login Form -->
    <form id="loginForm">
        <div id="loginError" class="error-message hidden"></div>
        <div class="form-group">
            <label>Email Address</label>
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="loginEmail" placeholder="teacher@school.rw" required>
            </div>
        </div>
        <div class="form-group">
            <label>Password</label>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
        </div>
        <button type="submit" class="btn"><i class="fas fa-arrow-right-to-bracket"></i> LOGIN</button>
    </form>

    <!-- Signup Form -->
    <form id="signupForm" class="hidden">
        <div id="signupError" class="error-message hidden"></div>
        <div id="signupSuccess" class="success-message hidden"></div>
        
        <div class="form-group">
            <label>Full Name</label>
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="fullname" placeholder="Mr. Jean UWIMANA" required>
            </div>
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" placeholder="teacher@school.rw" required>
            </div>
        </div>
        <div class="form-group">
            <label>School Name</label>
            <div class="input-group">
                <i class="fas fa-school"></i>
                <input type="text" id="school" placeholder="G.S. Saint Andre" required>
            </div>
        </div>
        <div class="form-group">
            <label>Subject Taught</label>
            <div class="input-group">
                <i class="fas fa-flask"></i>
                <input type="text" id="subject" placeholder="Physics" required>
            </div>
        </div>
        <div class="form-group">
            <label>Password</label>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
        </div>
        <div class="form-group">
            <label>Confirm Password</label>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="confirmPassword" placeholder="••••••••" required>
            </div>
        </div>
        <button type="submit" class="btn"><i class="fas fa-user-plus"></i> CREATE ACCOUNT</button>
    </form>

    <div class="footer">
        <p>© 2026 SmartClass Analytics | Secure Teacher Portal</p>
        <p style="margin-top: 8px;">Works offline • Syncs when online</p>
    </div>
</div>

<script>
    // Tab switching
    const tabs = document.querySelectorAll('.tab');
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');

    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            
            if (tab.dataset.tab === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
            }
        });
    });

    // SIGNUP FUNCTION - THIS MAKES THE BUTTON WORK
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // Clear previous messages
        document.getElementById('signupError').classList.add('hidden');
        document.getElementById('signupSuccess').classList.add('hidden');
        
        // Get values
        const fullname = document.getElementById('fullname').value.trim();
        const email = document.getElementById('email').value.trim();
        const school = document.getElementById('school').value.trim();
        const subject = document.getElementById('subject').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        
        // Validation
        if (!fullname || !email || !school || !subject || !password) {
            document.getElementById('signupError').textContent = 'All fields are required';
            document.getElementById('signupError').classList.remove('hidden');
            return;
        }
        
        if (password !== confirmPassword) {
            document.getElementById('signupError').textContent = 'Passwords do not match';
            document.getElementById('signupError').classList.remove('hidden');
            return;
        }
        
        if (password.length < 6) {
            document.getElementById('signupError').textContent = 'Password must be at least 6 characters';
            document.getElementById('signupError').classList.remove('hidden');
            return;
        }
        
        // Show loading state
        const submitBtn = document.querySelector('#signupForm .btn');
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';
        submitBtn.disabled = true;
        
        try {
            // Send to backend API
            const response = await fetch('http://localhost:5000/api/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fullname, email, school, subject, password })
            });
            
            const data = await response.json();
            
            if (data.success) {
                document.getElementById('signupSuccess').textContent = 'Account created successfully! Please login.';
                document.getElementById('signupSuccess').classList.remove('hidden');
                
                // Clear form
                document.getElementById('fullname').value = '';
                document.getElementById('email').value = '';
                document.getElementById('school').value = '';
                document.getElementById('subject').value = '';
                document.getElementById('password').value = '';
                document.getElementById('confirmPassword').value = '';
                
                // Switch to login tab after 2 seconds
                setTimeout(() => {
                    document.querySelector('.tab[data-tab="login"]').click();
                }, 2000);
            } else {
                document.getElementById('signupError').textContent = data.message || 'Signup failed';
                document.getElementById('signupError').classList.remove('hidden');
            }
        } catch (error) {
            console.error('Signup error:', error);
            document.getElementById('signupError').textContent = 'Cannot connect to server. Make sure backend is running on port 5000';
            document.getElementById('signupError').classList.remove('hidden');
        } finally {
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
        }
    });

    // LOGIN FUNCTION
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        document.getElementById('loginError').classList.add('hidden');
        
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        
        if (!email || !password) {
            document.getElementById('loginError').textContent = 'Email and password required';
            document.getElementById('loginError').classList.remove('hidden');
            return;
        }
        
        const submitBtn = document.querySelector('#loginForm .btn');
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
        submitBtn.disabled = true;
        
        try {
            const response = await fetch('http://localhost:5000/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            
            const data = await response.json();
            
            if (data.success) {
                localStorage.setItem('teacherToken', data.token);
                localStorage.setItem('teacherName', data.name);
                localStorage.setItem('teacherEmail', email);
                window.location.href = '/dashboard.html';
            } else {
                document.getElementById('loginError').textContent = data.message || 'Invalid credentials';
                document.getElementById('loginError').classList.remove('hidden');
            }
        } catch (error) {
            console.error('Login error:', error);
            document.getElementById('loginError').textContent = 'Cannot connect to server. Make sure backend is running on port 5000';
            document.getElementById('loginError').classList.remove('hidden');
        } finally {
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
